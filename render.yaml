services:
  - type: web
    name: saint-guard-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /tmp/saint_guard.sqlite3
      - key: LOG_CHAT_ID
        sync: false
      - key: BOT_OWNER_ID
        value: "0"
