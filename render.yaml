services:
  - type: worker
    name: saint-guard-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    disk:
      name: saint-guard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /data/saint_guard.sqlite3
      - key: LOG_CHAT_ID
        sync: false
      - key: BOT_OWNER_ID
        value: "0"
